name: ci

on:
  push:
    branches: [main]
  pull_request:

# Two jobs, both short. No benchmark job on purpose: a shared runner measures
# the runner, not the code.

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch zstd
        shell: cmd
        run: tools\fetch-zstd.cmd
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install a C++23 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build
      - name: Fetch zstd
        run: bash tools/fetch-zstd.sh
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DAL_SANITIZE=ON
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install a C++23 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build
      - name: Fetch zstd
        run: bash tools/fetch-zstd.sh
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # Real Graviton hardware, which is the only way to settle the arm64 rows
      # that docs/performance.md currently records as not measured.
      - name: Bench
        run: ./build/arrowlane-cpp bench --rows 200000 --repeats 5 --json > bench-arm64.json
      - name: Upload the numbers
        uses: actions/upload-artifact@v7
        with:
          name: bench-arm64
          path: bench-arm64.json
      # D5 asks for a paired ratio on a second architecture, which needs both sides
      # measured in the same round. The C++ image is built first so the Rust
      # checkout does not land inside its build context.
      - name: Build the Wolfi test image
        run: docker build -t arrowlane-cpp-test:wolfi -f tools/Dockerfile.test .
      - name: Build the C++ benchmark image
        run: docker build -t arrowlane-bench-cpp:local -f bench/Dockerfile.cpp .
      - name: Check out the Rust reference
        uses: actions/checkout@v5
        with:
          repository: kennaidoo/arrowlane-rust
          path: arrowlane-rust
      - name: Build the Rust benchmark image
        run: docker build -t arrowlane-bench-rust:local -f arrowlane-rust/bench/Dockerfile arrowlane-rust
      # --check exits 1 on any condition that is not a win, and ipc encode is a
      # known loss on this runner (D5). The step is a record, not a gate.
      - name: Paired ratio
        run: >
          python3 bench/compare.py --impls cpp,rust --rows 200000
          --repeats 7 --rounds 3 --check
        continue-on-error: true
