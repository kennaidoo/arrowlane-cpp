name: ci

on:
  push:
    branches: [main]
  pull_request:

# Two jobs, both short. No benchmark job on purpose: a shared runner measures
# the runner, not the code.

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch zstd
        shell: cmd
        run: tools\fetch-zstd.cmd
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install a C++23 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build
      - name: Fetch zstd
        run: bash tools/fetch-zstd.sh
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DAL_SANITIZE=ON
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install a C++23 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build
      - name: Fetch zstd
        run: bash tools/fetch-zstd.sh
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # Real Graviton hardware, which is the only way to settle the arm64 rows
      # that docs/performance.md currently records as not measured.
      - name: Bench
        run: ./build/arrowlane-cpp bench --rows 200000 --repeats 5 --json > bench-arm64.json
      - name: Upload the numbers
        uses: actions/upload-artifact@v4
        with:
          name: bench-arm64
          path: bench-arm64.json
